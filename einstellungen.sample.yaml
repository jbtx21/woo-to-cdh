# TEXMA WooCommerce → CDH — Einstellungen (VORLAGE, Welle 2)
# ==========================================================
#
# Alles AUSSER den Zugangsdaten. Innendienst-tauglich, enthält KEINE
# Consumer Keys/Secrets — die liegen in zugang.yaml.
#
# Die echte einstellungen.yaml liegt auf
#   V:\Warenwirtschaftssystem\WooCommerce Import\
# und gehört NICHT ins Repo (siehe .gitignore).
#
# Entsteht per Migration aus config.yaml:
#   python migrate_config.py --probelauf   # nur anzeigen
#   python migrate_config.py               # schreiben

# --- Globale Optionen -------------------------------------------------------
cdh_import_folder:   'V:\Warenwirtschaftssystem\WooCommerce Import\wex-archiv'
excel_export_folder: 'V:\Warenwirtschaftssystem\WooCommerce Import\excel-archiv'
cdh_exe:             'C:\CDH\CDH_WEX.EXE'

veredelung_prefixes:
  - '004/'   # Stick
  - '316/'   # Stick
  - '006/'   # Transferdruck
  - '234/'   # Silberreflex

order_no_with_name: true
log_level: INFO
status_after_export: completed

# --- Shops (ohne Zugangsdaten) ----------------------------------------------
shops:

  - name: CAF-Shop
    enabled: true
    url: https://shop.texma-gmbh.de/caf-shop/
    datev_no: 19541
    order_type: AB

  - name: Stoll-Shop
    enabled: true
    url: https://shop.texma-gmbh.de/stoll-shop/
    datev_no: 19377
    order_type: AB

  - name: Xond-Shop
    enabled: true
    url: https://shop.texma-gmbh.de/xond-shop/
    datev_no: 19705
    order_type: AB

  - name: SFS-Shop
    enabled: true
    url: https://shop.texma-gmbh.de/sfs-shop/
    datev_no: 19616
    order_type: AB

  - name: Allgaier-Shop
    enabled: false
    url: https://shop.texma-gmbh.de/allgaier/
    datev_no: 10698
    order_type: AB
    included_statuses: [processing]
    combine_by_delivery: true

  - name: Ensinger-Shop
    enabled: false
    url: https://shop.texma-gmbh.de/ensinger-shop/
    datev_no: 14020
    order_type: AB
    import_on_days: [1]
    combine_by_delivery: true
    aggregate_all_positions: true
    # Lieferort ohne feste Adresse in lieferadressen.yaml:
    #   cdh (Standard: Anschrift leer, CDH liefert an den Kundenstamm) ·
    #   firma (Rechnungsadresse der ersten Bestellung) · versand
    #   (Versandadresse der ersten Bestellung) · sperren (nicht importieren)
    unknown_delivery: cdh
    # Summenblatt in der Excel: je Lieferort, mit Veredelungen
    excel_summary: true
    excel_summary_by: ort
    excel_summary_veredelungen: true
    extra_excel_meta:
      - key: teambestellung
        label: Teambestellung
      - key: mitarbeiterin
        label: Vorname (MitarbeiterIn)
      - key: mitarbeiterin_2
        label: Nachname (MitarbeiterIn)
      - key: personalnummer
        label: Personalnummer

  - name: KVSW-Shop
    enabled: false
    url: https://shop.texma-gmbh.de/kvsw-re-shop/
    datev_no: 19742
    order_type: AB
