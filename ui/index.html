<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WooCommerce → CDH</title>
<link rel="stylesheet" href="fonts/inter.css">
<style>
:root {
  /* iOS-Systemfarben, hell */
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --fill: rgba(118, 118, 128, .12);
  --label: #000000;
  --label-2: rgba(60, 60, 67, .60);
  --label-3: rgba(60, 60, 67, .30);
  --sep: rgba(60, 60, 67, .29);
  --blue: #007AFF;
  --green: #34C759;
  --orange: #FF9500;
  --red: #FF3B30;
  --indigo: #5856D6;
  --teal: #30B0C7;
  --pink: #FF2D55;
  --purple: #AF52DE;
  --gray: #8E8E93;
  --seg-on: #FFFFFF;
  --bar: rgba(242, 242, 247, .82);
  --hud: rgba(30, 30, 30, .86);
  --logo-plate: transparent;

  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;

  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --card: #1C1C1E; --fill: rgba(118, 118, 128, .24);
    --label: #FFFFFF; --label-2: rgba(235, 235, 245, .60); --label-3: rgba(235, 235, 245, .30);
    --sep: rgba(84, 84, 88, .65);
    --blue: #0A84FF; --green: #30D158; --orange: #FF9F0A; --red: #FF453A;
    --indigo: #5E5CE6; --teal: #40C8E0; --pink: #FF375F; --purple: #BF5AF2; --gray: #8E8E93;
    --seg-on: #636366; --bar: rgba(0, 0, 0, .78); --hud: rgba(60, 60, 60, .9); --logo-plate: #FFFFFF;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --card: #1C1C1E; --fill: rgba(118, 118, 128, .24);
  --label: #FFFFFF; --label-2: rgba(235, 235, 245, .60); --label-3: rgba(235, 235, 245, .30);
  --sep: rgba(84, 84, 88, .65);
  --blue: #0A84FF; --green: #30D158; --orange: #FF9F0A; --red: #FF453A;
  --indigo: #5E5CE6; --teal: #40C8E0; --pink: #FF375F; --purple: #BF5AF2; --gray: #8E8E93;
  --seg-on: #636366; --bar: rgba(0, 0, 0, .78); --hud: rgba(60, 60, 60, .9); --logo-plate: #FFFFFF;
}

*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; height: 100%; background: var(--bg); color: var(--label);
  font-family: var(--font); font-size: 16px; line-height: 1.35; letter-spacing: -.011em;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
.num { font-feature-settings: "tnum" 1; }

/* ---------------------------------------------------------- Gerüst ---- */
.shell { height: 100%; display: grid; grid-template-rows: 1fr; grid-template-columns: minmax(0, 1fr); }
.stage { min-height: 0; min-width: 0; height: 100%; }
.split { height: 100%; display: grid; grid-template-columns: 330px 1fr; }
.shell[data-tab="import"] .split { display: none; }
.shell[data-tab="settings"] #importPane { display: none; }

/* Tab-Leiste: auf dem Desktop schwebend oben (iPadOS), mobil unten */
.tabbar {
  position: fixed; z-index: 10; left: 50%; transform: translateX(-50%);
  top: calc(7px + env(safe-area-inset-top, 0px));
  display: flex; gap: 2px; padding: 3px; border-radius: 22px;
  background: var(--bar); border: .5px solid var(--sep);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  box-shadow: 0 4px 18px rgba(0,0,0,.08);
}
.tabbar button {
  position: relative; display: flex; align-items: center; gap: 7px;
  padding: 7px 18px; border-radius: 19px; font-size: 15px; font-weight: 600; color: var(--label-2);
}
.tabbar button svg { width: 18px; height: 18px; display: none; }
.tabbar button[aria-selected="true"] { background: var(--card); color: var(--label); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
.tab-badge {
  min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff;
  font-size: 11px; font-weight: 600; line-height: 17px; text-align: center; font-feature-settings: "tnum" 1;
}
@media (min-width: 761px) { .list .navbar .nav-r { visibility: hidden; } }

.banner { display: flex; gap: 12px; padding: 12px 16px; align-items: center; }
.banner .icon { background: var(--blue); width: 26px; height: 26px; border-radius: 50%; }
.banner p { margin: 0; flex: 1; font-size: 15px; }
.pane { height: 100%; overflow-y: auto; position: relative; }
.pane.list { border-right: .5px solid var(--sep); }

.navbar {
  position: sticky; top: 0; z-index: 5;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  height: 52px; padding: 0 16px;
  background: var(--bar);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: .5px solid transparent;
}
.navbar .nav-l { justify-self: start; }
.navbar .nav-c { font-weight: 600; font-size: 17px; }
.navbar .nav-r { justify-self: end; display: flex; gap: 18px; align-items: center; }
.navlink { color: var(--blue); font-size: 17px; display: inline-flex; align-items: center; gap: 2px; }
.navlink.bold { font-weight: 600; }
.navlink:disabled { color: var(--label-3); cursor: default; }
.navlink svg { width: 12px; height: 20px; }
.back { display: none; }

.content { padding: 0 20px 48px; max-width: 760px; margin: 0 auto; }
.list .content { padding: 0 16px 40px; }

.large-title { font-size: 34px; font-weight: 700; letter-spacing: -.025em; line-height: 1.15; margin: 4px 4px 18px; }
.subtitle { color: var(--label-2); font-size: 15px; margin: -12px 4px 22px; }

/* --------------------------------------------------------- Gruppen ---- */
.group { margin-bottom: 28px; }
.group-head { color: var(--label-2); font-size: 13px; margin: 0 16px 7px; }
.group-foot { color: var(--label-2); font-size: 13px; line-height: 1.4; margin: 7px 16px 0; }
.card { background: var(--card); border-radius: 12px; overflow: hidden; }

.row {
  display: flex; align-items: center; gap: 12px; min-height: 46px; padding-left: 16px; width: 100%;
  position: relative;
}
button.row:active, .row.tap:active { background: var(--fill); }
.row-body {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;
  align-self: stretch; padding: 11px 16px 11px 0;
  border-bottom: .5px solid var(--sep);
}
.card > .row:last-child .row-body, .card > :last-child .row-body { border-bottom: 0; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-size: 16px; }
.row-sub { color: var(--label-2); font-size: 13px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-value { color: var(--label-2); font-size: 16px; white-space: nowrap; }
.chev { width: 8px; height: 13px; color: var(--label-3); flex: none; }
.check { width: 15px; height: 13px; color: var(--blue); flex: none; }
.lock { width: 13px; height: 15px; color: var(--label-3); flex: none; }
.row.action .row-title { color: var(--blue); }
.row.danger .row-title { color: var(--red); }

.icon {
  width: 30px; height: 30px; border-radius: 7px; flex: none;
  display: grid; place-items: center; color: #fff; font-size: 15px; font-weight: 600; letter-spacing: 0;
}
.icon svg { width: 17px; height: 17px; }

.row[aria-current="true"] { background: var(--blue); }
.row[aria-current="true"] .row-title,
.row[aria-current="true"] .row-sub,
.row[aria-current="true"] .row-value,
.row[aria-current="true"] .chev { color: #fff; }
.row[aria-current="true"] .row-body { border-bottom-color: transparent; }
@media (min-width: 761px) { .row[aria-current="true"] .icon { background: rgba(255,255,255,.24) !important; } }

/* iOS-Schalter */
.switch { position: relative; width: 51px; height: 31px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch .t { position: absolute; inset: 0; border-radius: 16px; background: var(--fill); transition: background .2s; pointer-events: none; }
.switch .t::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
  background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16);
  transition: transform .2s;
}
.switch input:checked + .t { background: var(--green); }
.switch input:checked + .t::after { transform: translateX(20px); }
.switch input:disabled + .t { opacity: .4; }
.switch input:focus-visible + .t { outline: 2px solid var(--blue); outline-offset: 2px; }

/* Eingabe in einer Zeile */
.row-input {
  flex: 1; min-width: 0; border: 0; background: none; text-align: right; color: var(--label-2);
  padding: 0; outline: none;
}
.row-input:focus { color: var(--label); }

/* Zusammenfassung */
.summary { display: flex; gap: 12px; padding: 14px 16px; align-items: flex-start; }
.summary .icon { background: var(--blue); width: 26px; height: 26px; border-radius: 50%; }
.summary p { margin: 2px 0 0; font-size: 15px; line-height: 1.45; }

/* Segmented Control */
.seg {
  display: grid; grid-template-columns: repeat(3, 1fr); background: var(--fill);
  border-radius: 9px; padding: 2px; margin: 12px 16px;
}
.seg button {
  font-size: 13px; font-weight: 500; padding: 6px 4px; border-radius: 7px; text-align: center;
  line-height: 1.25;
}
.seg button[aria-checked="true"] {
  background: var(--seg-on); font-weight: 600;
  box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04);
}

/* Vorschau CDH-Auftrag */
.preview { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
.cdh { border-radius: 10px; background: var(--bg); overflow: hidden; }
.cdh .oh { font-size: 13px; font-weight: 600; padding: 8px 12px; }
.cdh .ln { font-size: 13px; padding: 6px 12px; display: flex; gap: 10px; border-top: .5px solid var(--sep); font-feature-settings: "tnum" 1; }
.cdh .ln.sep { color: var(--label-2); background: var(--fill); }
.cdh .q { min-width: 24px; text-align: right; color: var(--label-2); }

/* Kalender */
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 10px 12px 14px; }
.days button {
  aspect-ratio: 1; max-width: 42px; width: 100%; justify-self: center; border-radius: 50%;
  font-size: 15px; text-align: center; font-feature-settings: "tnum" 1;
}
.days button[aria-pressed="true"] { background: var(--blue); color: #fff; font-weight: 600; }
.days button:not([aria-pressed="true"]):hover { background: var(--fill); }

.warn .icon { background: var(--orange); }

.logo { background: var(--logo-plate); border-radius: 8px; padding: 5px 7px; display: inline-block; margin: 2px 4px 0; }
.logo img { display: block; height: 22px; width: auto; }

.empty-detail { display: grid; place-items: center; height: 70%; color: var(--label-2); }

/* -------------------------------------------------------- Overlays ---- */
.backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20;
  display: grid; place-items: center; padding: 20px;
  animation: fade .2s ease-out;
}
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }
.sheet {
  width: 100%; max-width: 540px; max-height: calc(100% - 40px); overflow-y: auto;
  background: var(--bg); border-radius: 14px; animation: rise .25s ease-out;
}
.sheet .navbar { position: sticky; background: var(--bar); border-radius: 14px 14px 0 0; }
.sheet .content { padding: 20px 16px 28px; }
.form-row { display: flex; align-items: center; gap: 12px; min-height: 46px; padding-left: 16px; }
.form-row .row-body { gap: 12px; }
.form-row label { width: 120px; flex: none; }
.form-row input { flex: 1; min-width: 0; border: 0; background: none; outline: none; padding: 0; }
.form-row input::placeholder { color: var(--label-3); }

.alert-box {
  width: 270px; background: var(--card); border-radius: 14px; overflow: hidden; text-align: center;
  animation: rise .2s ease-out;
}
.alert-box .txt { padding: 19px 16px 17px; }
.alert-box h4 { margin: 0 0 4px; font-size: 17px; font-weight: 600; }
.alert-box p { margin: 0; font-size: 13px; line-height: 1.4; }
.alert-box .btns { display: grid; grid-template-columns: 1fr 1fr; border-top: .5px solid var(--sep); }
.alert-box .btns button { padding: 11px; color: var(--blue); font-size: 17px; text-align: center; }
.alert-box .btns button + button { border-left: .5px solid var(--sep); font-weight: 600; }

.hud {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.96);
  background: var(--hud); color: #fff; padding: 14px 20px; border-radius: 14px;
  font-size: 15px; text-align: center; max-width: 280px; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s; z-index: 30;
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
}
.hud.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

.dirty-pill {
  font-size: 12px; color: var(--label-2); background: var(--fill); border-radius: 10px; padding: 2px 8px;
  font-weight: 500;
}


/* ------------------------------------------------------ Bestellungen ---- */
.selc {
  width: 22px; height: 22px; border-radius: 50%; flex: none;
  border: 1.5px solid var(--label-3); display: grid; place-items: center;
}
.selc svg { width: 12px; height: 10px; color: #fff; opacity: 0; }
[aria-checked="true"] > .selc, [aria-checked="true"] .selc { background: var(--blue); border-color: var(--blue); }
[aria-checked="true"] > .selc svg, [aria-checked="true"] .selc svg { opacity: 1; }
.selc.off { opacity: .35; }
.row.indent { padding-left: 62px; }
.row.indent .row-title { font-size: 15px; }
.warn-text { color: var(--orange); }
.ok-text { color: var(--green); }

.big-btn {
  display: block; width: 100%; background: var(--blue); color: #fff; font-weight: 600; font-size: 17px;
  border-radius: 12px; padding: 14px; text-align: center;
}
.big-btn:disabled { background: var(--fill); color: var(--label-3); cursor: default; }

.hero { text-align: center; padding: 34px 20px 26px; }
.hero .icon { width: 56px; height: 56px; border-radius: 14px; margin: 0 auto 14px; background: var(--blue); }
.hero .icon svg { width: 30px; height: 30px; }
.hero h2 { margin: 0 0 6px; font-size: 20px; font-weight: 600; }
.hero p { margin: 0 auto 20px; color: var(--label-2); font-size: 15px; max-width: 34ch; }

.toolbar {
  position: sticky; bottom: 0; z-index: 4;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
  padding: 10px max(16px, calc((100% - 760px) / 2 + 20px));
  background: var(--bar); border-top: .5px solid var(--sep);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
}
.toolbar .mid { font-size: 13px; color: var(--label-2); text-align: center; }
.toolbar .r { justify-self: end; }

.spin {
  width: 22px; height: 22px; flex: none; border-radius: 50%;
  border: 2.5px solid var(--fill); border-top-color: var(--blue);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.state { width: 22px; height: 22px; flex: none; border-radius: 50%; display: grid; place-items: center; }
.state.wait { border: 1.5px solid var(--label-3); }
.state.done { background: var(--green); }
.state.done svg { width: 12px; height: 10px; color: #fff; }

.pos { display: flex; gap: 12px; align-items: baseline; }
.pos .q { min-width: 26px; color: var(--label-2); font-feature-settings: "tnum" 1; }
.pos .p { margin-left: auto; text-align: right; font-feature-settings: "tnum" 1; white-space: nowrap; }
.pos .p .row-sub { margin-top: 1px; }

.addr { font-size: 15px; line-height: 1.45; }

/* ----------------------------------------------------- Admin-Passwort ---- */
.pw-field {
  width: 100%; margin-top: 14px; padding: 8px 10px; border-radius: 8px; border: .5px solid var(--sep);
  background: var(--bg); outline: none; font-size: 15px; letter-spacing: .08em;
}
.pw-field:focus { border-color: var(--blue); }
.pw-err { color: var(--red); font-size: 13px; margin-top: 8px; min-height: 17px; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.alert-box.shake { animation: shake .35s; }
.admin-row .icon { background: var(--orange); }

/* --------------------------------------------------------- Assistent ---- */
.steps { display: flex; gap: 6px; justify-content: center; padding: 4px 0 18px; }
.steps span { width: 7px; height: 7px; border-radius: 50%; background: var(--label-3); }
.steps span.on { background: var(--blue); width: 20px; border-radius: 4px; }
.steps span.done { background: var(--blue); opacity: .45; }
.wiz-lead { text-align: center; margin: 0 8px 20px; }
.wiz-lead h3 { margin: 0 0 6px; font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.wiz-lead p { margin: 0; color: var(--label-2); font-size: 15px; }
.form-row input[type="password"] { font-feature-settings: "tnum" 1; letter-spacing: .08em; }
.state.fail { background: var(--red); }
.state.warn { background: var(--orange); }
.state.warn svg, .state.fail svg { width: 12px; height: 12px; color: #fff; }
.who { color: var(--label-2); font-size: 13px; margin: -12px 16px 0; }

/* ------------------------------------------------------ Aktionsblatt ---- */
.actions { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 8px; animation: rise .22s ease-out; }
.actions .grp { background: var(--card); border-radius: 14px; overflow: hidden; }
.actions .ttl { padding: 13px 16px; text-align: center; color: var(--label-2); font-size: 13px; border-bottom: .5px solid var(--sep); }
.actions button { display: block; width: 100%; text-align: center; padding: 16px; font-size: 18px; color: var(--blue); }
.actions button + button { border-top: .5px solid var(--sep); }
.actions button .n { color: var(--label-2); font-size: 15px; }
.actions .cancel { font-weight: 600; }

.xl { width: 100%; border-collapse: collapse; font-size: 13px; font-feature-settings: "tnum" 1; }
.xl th { text-align: left; font-weight: 600; color: var(--label-2); padding: 7px 12px; background: var(--fill); }
.xl td { padding: 7px 12px; border-top: .5px solid var(--sep); }
.xl td.q { text-align: right; width: 44px; }
.xl tr.grp td { font-weight: 600; background: var(--bg); }
.xl-wrap { overflow-x: auto; }
.sheets { display: flex; gap: 6px; padding: 12px 16px 0; }
.sheets span { font-size: 12px; padding: 4px 10px; border-radius: 6px; background: var(--fill); color: var(--label-2); }

/* ----------------------------------------------------------- Mobil ---- */
@media (max-width: 760px) {
  .shell { grid-template-rows: 1fr auto; }
  .split { grid-template-columns: 1fr; }
  .pane.list { border-right: 0; }
  .split[data-view="list"] .pane.detail { display: none; }
  .split[data-view="detail"] .pane.list { display: none; }
  .tabbar {
    position: static; transform: none; border-radius: 0; box-shadow: none; border: 0;
    border-top: .5px solid var(--sep); display: grid; grid-template-columns: 1fr 1fr; padding: 6px 0 2px;
  }
  .tabbar button {
    flex-direction: column; gap: 2px; padding: 2px 0 4px; border-radius: 0; font-size: 10.5px; font-weight: 500;
    color: var(--gray); justify-content: center;
  }
  .tabbar button svg { display: block; width: 26px; height: 26px; }
  .tabbar button[aria-selected="true"] { background: none; box-shadow: none; color: var(--blue); }
  .tab-badge { position: absolute; top: 0; left: calc(50% + 8px); }
  .back { display: inline-flex; }
  .content { padding: 0 16px 40px; }
  .row[aria-current="true"] { background: none; }
  .row[aria-current="true"] .row-title { color: var(--label); }
  .row[aria-current="true"] .row-sub, .row[aria-current="true"] .row-value { color: var(--label-2); }
  .row[aria-current="true"] .chev { color: var(--label-3); }
  .row[aria-current="true"] .row-body { border-bottom-color: var(--sep); }
  .backdrop { place-items: end center; padding: 0; }
  .backdrop.center { place-items: center; padding: 20px; }
  .sheet { max-width: none; border-radius: 14px 14px 0 0; max-height: 92%; }
  .form-row label { width: 96px; }
  .actions { max-width: none; padding: 0 8px 8px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.pw-err { white-space: pre-line; }
.fatal { max-width: 520px; margin: 18vh auto 0; padding: 0 20px; text-align: center; }
.fatal h1 { font-size: 22px; margin: 0 0 8px; }
.fatal p { color: var(--label-2); white-space: pre-line; }
.placeholder { padding: 32px 20px; text-align: center; color: var(--label-2); }
</style>
</head>
<body>
<div class="shell" id="shell" data-tab="settings">
  <main class="stage">
    <section class="pane single" id="importPane" aria-label="Import"></section>
    <div class="split" id="split" data-view="list">
      <section class="pane list" id="list"></section>
      <section class="pane detail" id="detail"></section>
    </div>
  </main>
  <nav class="tabbar" id="tabbar" aria-label="Bereiche"></nav>
</div>
<div id="overlay"></div>
<div class="hud" id="hud" role="status" aria-live="polite"></div>

<script>
// ------------------------------------------------------------------ Daten
// Welle 5: Alle Daten kommen aus Python (einstellungen_api.EinstellungenApi,
// über pywebview als window.pywebview.api). Hier liegt keine Logik, die
// über Rechte entscheidet — Admin-Modus und geschützte Felder prüft Python.
let initial = [];
let initialGlobal = { prefixes: [] };
let LOG = [];
let USER = { name: "" };
let TOKEN = "";
let ADMIN_PW_SET = true;

const ADMIN_MIN = 10;
let adminUntil = 0;
const isAdmin = () => Date.now() < adminUntil;
const adminLeft = () => Math.max(1, Math.ceil((adminUntil - Date.now()) / 60000));

let shops = [];
let global = { prefixes: [] };
let current = null;
let tab = "settings";
let unlocked = {};
let overlay = null;
let methodsLoaded = new Set();   // Shops, deren Versandarten schon geholt wurden
let busy = false;
let geladen = false;             // erst nach laden() zeichnen

const api = () => window.pywebview.api;

function anwenden(st) {
  initial = st.shops; initialGlobal = st.global; LOG = st.log;
  USER = { name: st.user }; TOKEN = st.token; ADMIN_PW_SET = st.adminPasswortGesetzt;
  adminUntil = st.admin.aktiv ? Date.now() + st.admin.rest_sekunden * 1000 : 0;
  // Bereits geholte Versandarten behalten (reine Anzeige)
  const methods = Object.fromEntries(shops.map((s) => [s.id, s.methods]));
  initial.forEach((s) => { if (methods[s.id]?.length) s.methods = methods[s.id]; });
  shops = structuredClone(initial); global = structuredClone(initialGlobal);
  if (!current || !(current.startsWith("__") || shopById(current))) current = shops[0]?.id || "__log";
}

async function laden() {
  const st = await api().laden();
  if (!st.ok) { fatal("Einstellungen nicht verfügbar", st.fehler); return; }
  anwenden(st); unlocked = {}; geladen = true;
  if (!narrow()) $("#split").dataset.view = "detail";
  render();
}

function fatal(title, text) {
  document.body.innerHTML = `<div class="fatal"><h1>${esc(title)}</h1><p>${esc(text)}</p></div>`;
}

function meldung(title, text) {
  overlay = { kind: "alert" };
  $("#overlay").innerHTML = `
    <div class="backdrop center" data-a="close">
      <div class="alert-box" role="alertdialog" aria-modal="true" aria-label="${esc(title)}">
        <div class="txt"><h4>${esc(title)}</h4><p class="pw-err" style="color:inherit">${esc(text)}</p></div>
        <div class="btns" style="grid-template-columns:1fr"><button data-a="close">OK</button></div>
      </div>
    </div>`;
}

async function sichern() {
  if (busy || !changeCount()) return;
  busy = true;
  try {
    const erg = await api().sichern({ shops, global, token: TOKEN });
    if (!erg.ok) { meldung("Nicht gesichert", erg.fehler); return; }
    anwenden(erg); unlocked = {};
    render();
    const n = erg.gesichert.length;
    hud(n ? `Gesichert: ${n} ${n === 1 ? "Änderung" : "Änderungen"}` : "Nichts zu sichern");
  } finally { busy = false; }
}

async function versandartenHolen(s) {
  if (!s || methodsLoaded.has(s.id) || !s.zugang) return;
  methodsLoaded.add(s.id);
  const erg = await api().versandarten(s.id);
  if (!erg.ok) return;             // ohne Versandarten kein Abgleich, sonst nichts
  for (const list of [shops, initial]) {
    const x = list.find((y) => y.id === s.id); if (x) x.methods = erg.methoden;
  }
  if (current === s.id) renderDetail();
}

// Für oberflaeche.py: ungesicherte Änderungen beim Schließen
window.ungesichert = () => changeCount();

function hud(msg) {
  const h = $("#hud"); h.textContent = msg; h.classList.add("show");
  clearTimeout(hud.t); hud.t = setTimeout(() => h.classList.remove("show"), 2200);
}

// Nur Anzeige, wird nie gesichert (siehe einstellungen_api.NUR_ANZEIGE)
const NUR_ANZEIGE = new Set(["methods", "color", "zugang"]);

function changeCount() {
  let n = 0;
  shops.forEach((s, i) => { for (const k of Object.keys(s)) if (!NUR_ANZEIGE.has(k) && JSON.stringify(s[k]) !== JSON.stringify(initial[i][k])) n++; });
  if (JSON.stringify(global) !== JSON.stringify(initialGlobal)) n++;
  return n;
}

function summary(s) {
  if (!s.active) return `${esc(s.name)} ist ausgeschaltet und wird beim Import übersprungen.`;
  const wann = s.days.length ? `Am ${s.days.map((d) => d + ".").join(", ")} des Monats` : "Bei jedem Lauf";
  const welche = s.statuses.length === 2 ? "Bestellungen in Bearbeitung und in Wartestellung"
    : s.statuses[0] === "processing" ? "Bestellungen in Bearbeitung" : "Bestellungen in Wartestellung";
  const wie = {
    einzeln: "und legt jede als eigenen Auftrag in CDH an",
    trenn: "bündelt sie je Lieferort zu einem Auftrag, mit einer Trennzeile pro Besteller",
    voll: "bündelt sie je Lieferort und fasst gleiche Artikel zu einer Zeile zusammen",
  }[s.bundling];
  const danach = s.after === "completed" ? " Im Shop stehen sie danach auf „Abgeschlossen“." : "";
  return `${wann} holt der Import alle ${welche} aus ${esc(s.name)}, ${wie}.${danach}`;
}

function navbar() {
  const n = changeCount();
  return `<div class="navbar">
    <span class="nav-l">
      <button class="navlink back" data-a="back">${I.back}Einstellungen</button>
      ${n && !narrow() ? `<button class="navlink" data-a="discard">Verwerfen</button>` : ""}
    </span>
    <span class="nav-c"></span>
    <span class="nav-r"><button class="navlink bold" data-a="save" ${n ? "" : "disabled"}>Sichern</button></span>
  </div>`;
}

function navImport() {
  return `<div class="navbar">
    <span class="nav-l"></span><span class="nav-c"></span>
    <span class="nav-r"></span>
  </div>`;
}

function renderTabbar() {
  const n = changeCount();
  $("#tabbar").innerHTML = [["import", "Import", I.tray24], ["settings", "Einstellungen", I.gear]].map(([id, l, ic]) => `
    <button role="tab" data-a="tab" data-tab="${id}" aria-selected="${tab === id}">
      ${ic}<span>${l}</span>${id === "settings" && n ? `<span class="tab-badge" aria-label="${n} ungesichert">${n}</span>` : ""}
    </button>`).join("");
  $("#shell").dataset.tab = tab;
}

function dirtyBanner() {
  const n = changeCount();
  if (!n) return "";

function lieferGroup(s) {
  const low = (x) => x.trim().toLowerCase();
  const known = new Set(s.orte.map((o) => low(o.ort)));
  const methods = s.methods || [];
  const inShop = new Set(methods.map(low));

  const addrKey = (o) => [o.name1, o.street, o.plz, o.city].map((x) => low(x || "")).join("|");
  const rows = s.orte.map((o, i) => {
    const missingInShop = methods.length && !inShop.has(low(o.ort));
    const twin = s.orte.find((x, j) => j < i && addrKey(x) === addrKey(o));
    return `<button class="row" data-a="edit-ort" data-i="${i}"><span class="row-body">
      <span class="row-main"><span class="row-title">${esc(o.ort)}</span>
      <div class="row-sub">${missingInShop
        ? `<span class="warn-text">Keine Versandart mit diesem Namen im Shop</span>`
        : twin ? `Gleiche Anschrift wie ${esc(twin.ort)}, eigener Auftrag`
        : `${esc(o.name2 ? o.name2 + ", " : "")}${esc(o.street)}, ${esc(o.country)}-${esc(o.plz)} ${esc(o.city)}`}</div></span>
      ${I.chev}
    </span></button>`;
  });
  const open = methods.filter((m) => !known.has(low(m))).map((m) => `
    <button class="row" data-a="add-ort" data-ort="${esc(m)}"><span class="row-body">
      <span class="row-main"><span class="row-title">${esc(m)}</span>
      <div class="row-sub"><span class="warn-text">Versandart im Shop ohne feste Adresse</span></div></span>
      <span class="row-value" style="color:var(--blue)">Anlegen</span>
    </span></button>`);

  const foot = methods.length
    ? `Abgeglichen mit den Versandarten im Shop${open.length || rows.some((r) => r.includes("warn-text")) ? ". Gelb markierte passen nicht zusammen — meist ein abweichender Name." : ", alles passt."}`
    : s.orte.length
      ? "Der Name muss genauso heißen wie die Versandart im Shop."
      : "Keine festen Adressen. Jede Bestellung behält die Versandadresse, die im Shop eingegeben wurde.";

  return `<div class="group">
    <div class="group-head">Feste Lieferadressen</div>
    <div class="card">
      ${rows.join("")}${open.join("")}
      <button class="row action" data-a="add-ort"><span class="row-body"><span class="row-main"><span class="row-title">Lieferort hinzufügen</span></span></span></button>
    </div>
    <div class="group-foot">${foot}</div>
  </div>`;
}

// --------------------------------------------------------------- Overlays
const FORMS = {
  ort: { title: "Lieferort", fields: [
    ["ort", "Lieferort", "wie Versandart im Shop", true], ["name1", "Firma", "", true], ["name2", "z. Hd.", "optional"],
    ["street", "Straße", "", true], ["plz", "PLZ", "", true], ["city", "Ort", "", true], ["country", "Land", "DE"] ] },
  excel: { title: "Zusatzfeld", fields: [ ["key", "Feld im Shop", "Data Name", true], ["label", "Spalte", "Überschrift", true] ] },
  prefix: { title: "Veredelung", fields: [ ["prefix", "Beginnt mit", "z. B. 004/", true], ["label", "Bedeutung", "z. B. Stick", true] ] },
};

function sheetShell(title, left, right, body) {
  return `<div class="backdrop" data-a="close">
    <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="navbar">
        <span class="nav-l">${left}</span><span class="nav-c">${esc(title)}</span><span class="nav-r">${right}</span>
      </div>
      <div class="content">${body}</div>
    </div></div>`;
}

function openSheet(type, index, shopId = current, prefill = null) {
  const s = shopById(shopId);
  const existing = type === "ort" ? s.orte[index] : type === "excel" ? s.excel[index]
    : type === "prefix" ? global.prefixes[index] : null;
  const src = existing || prefill;
  overlay = { kind: "form", type, index, shopId, isNew: index == null };
  const f = FORMS[type];
  $("#overlay").innerHTML = sheetShell(f.title,
    `<button class="navlink" data-a="close">Abbrechen</button>`,
    `<button class="navlink bold" data-a="sheet-done">Fertig</button>`,
    `<div class="group" id="formgroup"><div class="card">
      ${f.fields.map(([k, l, ph]) => `
        <div class="form-row"><span class="row-body">
          <label for="ff-${k}">${l}</label>
          <input id="ff-${k}" data-k="${k}" value="${esc(src?.[k] ?? "")}" placeholder="${esc(ph)}" autocomplete="off">
        </span></div>`).join("")}
    </div></div>
    ${!overlay.isNew ? `
    <div class="group"><div class="card">
      <button class="row danger" data-a="sheet-delete"><span class="row-body"><span class="row-main"><span class="row-title">${f.title} löschen</span></span></span></button>
    </div></div>` : ""}`);
  setTimeout(() => {
    const inputs = [...document.querySelectorAll("#overlay input[data-k]")];
    const target = inputs.find((i) => !i.value) || inputs[0];
    if (target && !$("#formgroup").hidden) target.focus();
  }, 60);
}

function closeOverlay() {
  if (overlay?.kind === "import" && overlay.running) return;
  overlay = null; $("#overlay").innerHTML = "";
}

function sheetDone() {
  const { type, index, isNew, shopId } = overlay;
  const s = shopById(shopId);
  const val = {};
  document.querySelectorAll("#overlay input[data-k]").forEach((i) => (val[i.dataset.k] = i.value.trim()));
  const missing = FORMS[type].fields.filter(([k, , , req]) => req && !val[k]).map(([, l]) => l);
  if (missing.length) { hud(`Bitte ausfüllen: ${missing.join(", ")}`); return; }
  if ("country" in val && !val.country) val.country = "DE";
  if (type === "ort") isNew ? s.orte.push(val) : (s.orte[index] = val);
  if (type === "excel") isNew ? s.excel.push(val) : (s.excel[index] = val);
  if (type === "prefix") isNew ? global.prefixes.push(val) : (global.prefixes[index] = val);
  closeOverlay(); render();
}

function sheetDelete() {
  const { type, index, shopId } = overlay; const s = shopById(shopId);
  if (type === "ort") s.orte.splice(index, 1);
  if (type === "excel") s.excel.splice(index, 1);
  if (type === "prefix") global.prefixes.splice(index, 1);
  closeOverlay(); render();
}


function openAlert() {
  overlay = { kind: "alert" };
  $("#overlay").innerHTML = `
    <div class="backdrop center" data-a="close">
      <div class="alert-box" role="alertdialog" aria-modal="true">

        <div class="btns">

          <button data-a="alert-ok">Ändern</button>
        </div>
      </div>
    </div>`;
  setTimeout(() => $("#overlay [data-a=alert-ok]").focus(), 30);
}


// ------------------------------------------------------------ Admin
function requireAdmin(title, msg, then) {
  if (isAdmin()) { then(); return; }
  if (!ADMIN_PW_SET) { meldung("Kein Admin-Passwort", "In zugang.yaml ist noch kein Admin-Passwort hinterlegt.\nSetzen: python migrate_config.py --admin-password …"); return; }
  overlay = { kind: "pw", then, tries: 0 };
  $("#overlay").innerHTML = `
    <div class="backdrop center" data-a="close">
      <div class="alert-box" role="alertdialog" aria-modal="true" aria-label="${esc(title)}">
        <div class="txt"><h4>${esc(title)}</h4><p>${esc(msg)}</p>
          <input class="pw-field" id="pw" type="password" placeholder="Admin-Passwort" autocomplete="off" aria-label="Admin-Passwort">
          <div class="pw-err" id="pw-err" aria-live="polite"></div></div>
        <div class="btns">
          <button data-a="close">Abbrechen</button>
          <button data-a="pw-ok">Entsperren</button>
        </div>
      </div>
    </div>`;
  setTimeout(() => $("#pw")?.focus(), 40);
}

async function pwSubmit() {
  const o = overlay;
  if (o.pending) return;
  o.pending = true;
  const erg = await api().admin_anmelden($("#pw").value);
  o.pending = false;
  if (erg.ok) {
    adminUntil = Date.now() + erg.rest_sekunden * 1000;
    const then = o.then; overlay = null; $("#overlay").innerHTML = "";
    render(); then();
    return;
  }
  const box = document.querySelector(".alert-box");
  box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
  $("#pw-err").textContent = erg.fehler;
  $("#pw").value = ""; $("#pw").focus();
}

function adminEnd() {
  adminUntil = 0; unlocked = {};
  api().admin_abmelden();
  if (overlay && ["wizard", "access"].includes(overlay.kind)) closeOverlay();
  render(); hud("Admin-Modus beendet");
}

// Ablauf prüfen und Restzeit aktualisieren
setInterval(() => {
  if (!adminUntil) return;
  if (!isAdmin()) { adminEnd(); return; }
  renderList();
}, 15000);


// ---------------------------------------------------------- Interaktion
function renderDetail() {
  if (current === "__global") return renderGlobal();
  if (current === "__log") return renderLog();
  return renderSettings();
}
function render() { if (!geladen) return; renderTabbar(); renderOrders(); renderList(); renderDetail(); }

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]");
  if (!el) return;
  const a = el.dataset.a;
  const s = shopById(current);

  switch (a) {
    case "tab": tab = el.dataset.tab; closeOverlay(); render(); break;
    case "nav": current = el.dataset.id; $("#split").dataset.view = "detail"; render(); $("#detail").scrollTop = 0; break;
    case "back": $("#split").dataset.view = "list"; break;
    case "close": if (e.target === el || el.tagName === "BUTTON") closeOverlay(); break;

    case "wizard": requireAdmin("Shop hinzufügen", "Dabei werden Zugangsschlüssel hinterlegt.", () => hud("Shop anlegen kommt mit Welle 7.")); break;
    case "access": requireAdmin("Zugang erneuern", "Ersetzt die Schlüssel, mit denen der Shop abgefragt wird.", () => hud("Zugang erneuern kommt mit Welle 7.")); break;
    case "todo": hud(el.dataset.msg || "Im Entwurf ohne Funktion."); break;
    case "unknown": s.unknownOrt = el.dataset.v; render(); break;
    case "sumby": s.excelSumBy = el.dataset.v; render(); break;

    case "unlock":
      requireAdmin("Debitornummer ändern", "Aufträge landen in CDH beim Kunden mit der neuen Nummer.", () => {
        unlocked[current] = true; render(); setTimeout(() => $("[data-c=debitor]")?.focus(), 30);
      }); break;
    case "pw-ok": pwSubmit(); break;
    case "admin-end": adminEnd(); break;
    case "alert-ok": unlocked[s.id] = true; closeOverlay(); render(); setTimeout(() => $("[data-c=debitor]")?.focus(), 30); break;
    case "status": {
      const set = new Set(s.statuses); const v = el.dataset.v;
      set.has(v) ? set.delete(v) : set.add(v);
      if (!set.size) { hud("Mindestens ein Status muss gewählt sein."); return; }
      s.statuses = ["processing", "on-hold"].filter((x) => set.has(x)); render(); break;
    }
    case "day": {
      const d = +el.dataset.d; const set = new Set(s.days);
      set.has(d) ? set.delete(d) : set.add(d);
      if (!set.size) { hud("Mindestens ein Tag, oder „Bei jedem Lauf“ einschalten."); return; }
      s.days = [...set].sort((x, y) => x - y); render(); break;
    }
    case "after": s.after = el.dataset.v; render(); break;
    case "bundling": s.bundling = el.dataset.v; render(); break;
    case "edit-ort": openSheet("ort", +el.dataset.i); break;
    case "add-ort": openSheet("ort", null, current, el.dataset.ort ? { ort: el.dataset.ort, country: "DE" } : null); break;
    case "edit-excel": openSheet("excel", +el.dataset.i); break;
    case "add-excel": openSheet("excel", null); break;
    case "edit-prefix": { const i = +el.dataset.i; requireAdmin("Veredelungen ändern", "Gilt für alle Shops.", () => openSheet("prefix", i)); break; }
    case "add-prefix": requireAdmin("Veredelungen ändern", "Gilt für alle Shops.", () => openSheet("prefix", null)); break;
    case "sheet-done": sheetDone(); break;
    case "sheet-delete": sheetDelete(); break;
    case "save": sichern(); break;
    case "discard":
      shops = structuredClone(initial); global = structuredClone(initialGlobal); unlocked = {};
      render(); hud("Änderungen verworfen."); break;
  }
});

document.addEventListener("change", (e) => {
  const c = e.target.dataset?.c; if (!c) return;
  // Debitornummer wird schon beim Tippen übernommen ("input"). Hier nicht neu
  // zeichnen: Das change-Ereignis kommt beim Verlassen des Feldes — genau
  // beim Klick auf „Sichern“, der sonst am neu gezeichneten Knopf verpufft.
  if (c === "debitor") return;
  const s = shop();
  if (c === "active") s.active = e.target.checked;
  if (c === "alldays") s.days = e.target.checked ? [] : [1];
  if (c === "nameInNo") s.nameInNo = e.target.checked;
  if (c === "excelSum") s.excelSum = e.target.checked;
  if (c === "excelSumVed") s.excelSumVed = e.target.checked;
  render();
});

document.addEventListener("input", (e) => {
  if (e.target.dataset?.c !== "debitor") return;
  const s = shop();
  s.debitor = e.target.value.replace(/\D/g, "");
  if (e.target.value !== s.debitor) e.target.value = s.debitor;
  renderList(); renderTabbar();
  const n = changeCount();
  const sv = document.querySelector("#detail [data-a=save]"); if (sv) sv.disabled = !n;
});

document.addEventListener("keydown", (e) => {
  if (!overlay) return;
  if (e.key === "Escape") closeOverlay();
  if (e.key === "Enter" && overlay.kind === "form" && e.target.tagName === "INPUT") sheetDone();
  if (e.key === "Enter" && overlay.kind === "wizard" && e.target.tagName === "INPUT") wizNext();
  if (e.key === "Enter" && overlay.kind === "pw") pwSubmit();
});

if (!narrow()) $("#split").dataset.view = "detail";
// pywebview stellt window.pywebview.api erst nach "pywebviewready" bereit
if (window.pywebview?.api?.laden) laden();
else window.addEventListener("pywebviewready", laden);
</script>
</body>
</html>
